<!doctype html>
<html>
	<head>
		<meta charset='utf8'/>
		<title>thenumbernine</title>
	</head>

	<script>
// 1. Inline blocking script runs immediately during parsing
let darkMode = false;

// how else to define this, run it before window.load or page render,
// and then run it again in the load to refresh the div?
// mabye put a separate window load event here?
const updateDarkMode = () => {
	const toggleDarkModeDiv = document.getElementById('toggle-darkmode');
	if (darkMode) {
		document.documentElement.setAttribute('data-theme', 'dark');
		if (toggleDarkModeDiv) toggleDarkModeDiv.innerText = '🌞';
	} else {
		document.documentElement.removeAttribute('data-theme', 'dark');
		if (toggleDarkModeDiv) toggleDarkModeDiv.innerText = '🌚';
	}
};

if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
	darkMode = true;
}
updateDarkMode();	// first time it will update data-theme dark (but won't update darkmode div since its not created yet)

window.addEventListener('load', e => {
	// second time will refresh icon of div toggle
	updateDarkMode();
});

const toggleDarkMode = () => {
	darkMode = !darkMode;
	updateDarkMode();
};
	</script>

	<link rel='stylesheet' href='index.css'/>
	<script type='module' src='index.js' defer></script>
	<body>
		<div id='toggle-darkmode' onclick='toggleDarkMode();'></div>

		<a href='https://linktr.ee/thenumbernine'>Myself</a>
		<br><br>

		<div class="card-grid"></div>

	</body>
</html>
